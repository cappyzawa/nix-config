#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
project_doc_fallback_filenames = ["CLAUDE.md"]
web_search = "live"
service_tier = "default"

[features]
hooks = true
memories = true

# Replaces the harness-injected <multi_agent_mode> developer message. The first two
# sentences are the stock text for non-proactive mode; the rest is ours. spawn_agent
# defaults to fork_turns="all", which copies the whole parent thread into every child
# and drops role/model overrides, so a single review request can fan out to millions
# of input tokens. Codex has no config knob for the default fork mode.
[features.multi_agent_v2]
multi_agent_mode_hint_text = """
Any earlier instruction enabling proactive multi-agent delegation no longer applies. Do not spawn sub-agents unless the user or applicable AGENTS.md/skill instructions explicitly ask for sub-agents, delegation, or parallel agent work. When you do spawn, always pass fork_turns="none" and write every fact the sub-agent needs into its message. A full-history fork copies this whole thread into each child and ignores agent_type, model, and reasoning_effort overrides.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 6

[sandbox_workspace_write]
network_access = false

[tui]
vim_mode_default = true
notifications = true
notification_condition = "unfocused"
status_line = ["model-with-reasoning", "context-remaining", "git-branch", "current-dir"]
